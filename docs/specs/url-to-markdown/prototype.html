<!doctype html>
<html lang="ko">
<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>URL → Markdown 프로토타입</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: copied verbatim from app/globals.css ──
     font: next/font(Inter, Geist)는 네트워크 폰트라 시스템 폰트 스택으로 대체했다. */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --radius: 0.625rem;
    --font: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-theme-dark {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    color-scheme: dark;
  }

  /* ── product (app) ── */
  .sh-stage { background: var(--background); color: var(--foreground) }
  .app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; padding: 8px 0 24px }
  .app-head { display: flex; align-items: center; justify-content: space-between; gap: 12px }
  .app-title { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px }
  .app-title small { font-weight: 400; color: var(--muted-foreground); font-size: 13px }
  .intro { margin: 0; color: var(--muted-foreground); font-size: 14px; line-height: 1.6 }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px;
    border: 1px solid transparent; border-radius: calc(var(--radius) * .8); font: inherit; font-size: 14px; font-weight: 500;
    white-space: nowrap; cursor: pointer; background: var(--primary); color: var(--primary-foreground) }
  .btn:hover { opacity: .88 }
  .btn:focus-visible, .input:focus-visible, .chip input:focus-visible + span { outline: 3px solid color-mix(in oklch, var(--ring) 50%, transparent); outline-offset: 0 }
  .btn:disabled { opacity: .5; cursor: not-allowed }
  .btn.outline { background: var(--background); color: var(--foreground); border-color: var(--border) }
  .btn.outline:hover { background: var(--muted); opacity: 1 }
  .btn.ghost { background: transparent; color: var(--foreground) }
  .btn.ghost:hover { background: var(--muted); opacity: 1 }
  .btn.icon { width: 36px; padding: 0 }
  .btn svg, .ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .spin { animation: spin .8s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }

  .input { height: 36px; width: 100%; min-width: 0; padding: 0 12px; border: 1px solid var(--input); border-radius: calc(var(--radius) * .8);
    background: transparent; color: var(--foreground); font: inherit; font-size: 14px }
  .input::placeholder { color: var(--muted-foreground) }
  .input[aria-invalid="true"] { border-color: var(--destructive) }

  .url-row { display: flex; gap: 8px }
  .url-field { position: relative; flex: 1; min-width: 0 }
  .url-field .input { height: 44px; padding-right: 44px; font-size: 15px }
  .url-field .clear { position: absolute; right: 4px; top: 4px; height: 36px; width: 36px }
  .url-row .go { height: 44px; padding: 0 20px }

  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 14px; line-height: 1.55; background: var(--card); color: var(--card-foreground) }
  .alert.destructive { border-color: color-mix(in oklch, var(--destructive) 40%, transparent); color: var(--destructive) }
  .alert.destructive .alert-desc { color: var(--foreground) }
  .alert b { display: block; font-weight: 600 }
  .alert .ico { margin-top: 2px }

  .card { border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4); background: var(--card); color: var(--card-foreground); overflow: hidden }
  .card-head { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px }
  .card-head h1 { margin: 0; font-size: 22px; line-height: 1.35; font-weight: 650; letter-spacing: -0.015em; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; color: var(--muted-foreground) }
  .meta .author { color: var(--foreground); font-weight: 500 }
  .meta a { color: inherit; text-underline-offset: 3px }
  .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 99px; background: var(--secondary); color: var(--secondary-foreground); font-size: 12px }
  .md-flow { padding: 20px }

  .md { font-size: 15px; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere }
  .md > :first-child { margin-top: 0 } .md > :last-child { margin-bottom: 0 }
  .md h2 { font-size: 18px; margin: 28px 0 8px; letter-spacing: -0.01em }
  .md h3 { font-size: 16px; margin: 22px 0 6px }
  .md p { margin: 0 0 14px }
  .md ul { margin: 0 0 14px; padding-left: 20px } .md li { margin: 2px 0 }
  .md a { color: var(--foreground); text-underline-offset: 3px }
  .md code { padding: 1px 6px; border-radius: 5px; background: var(--muted); font: .9em var(--font-mono) }
  .md blockquote { margin: 0 0 14px; padding: 2px 0 2px 14px; border-left: 3px solid var(--border); color: var(--muted-foreground) }

  .skel { display: flex; flex-direction: column; gap: 12px; padding: 20px }
  .skel i { display: block; height: 14px; border-radius: 6px; background: var(--muted); animation: pulse 1.4s ease-in-out infinite }
  .skel i.t { height: 26px; width: 70% } .skel i.w80 { width: 80% } .skel i.w55 { width: 55% }
  @keyframes pulse { 50% { opacity: .5 } }

  .export { display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 20px; border-bottom: 1px solid var(--border) }
  .export-label { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: block }
  .export-label span { font-weight: 400; color: var(--muted-foreground) }
  .chips { display: flex; flex-wrap: wrap; gap: 8px }
  .chip { position: relative }
  .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer }
  .chip span { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 99px; font-size: 13px; background: var(--background) }
  .chip input:checked + span { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary) }
  .custom-prompt { margin-top: 10px }
  .actions { display: flex; flex-wrap: wrap; gap: 8px }
  .actions .sep { width: 1px; background: var(--border); margin: 4px 4px }

  @media (max-width: 520px) {
    .card-head h1 { font-size: 19px }
    .actions .btn { flex: 1 1 calc(50% - 4px) }
    .actions .sep { display: none }
    .url-row .go { padding: 0 14px }
  }
  .sh-vp-390 .card-head h1 { font-size: 19px }
  .sh-vp-390 .actions .btn { flex: 1 1 calc(50% - 4px) }
  .sh-vp-390 .actions .sep { display: none }
  .sh-vp-390 .card-head, .sh-vp-390 .md-flow, .sh-vp-390 .export { padding-left: 16px; padding-right: 16px }
  .sh-vp-390 .url-row .go { padding: 0 14px }

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }
</style>

<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>

<main class="sh-stage">
  <section data-screen="convert" data-title="URL 변환" data-states="변환 중,결과,저자 없는 결과,오류">
    <div class="app">
      <header class="app-head">
        <h2 class="app-title" style="margin:0">URL → Markdown <small>LLM에 바로 넘기기</small></h2>
        <button class="btn ghost icon" id="theme-toggle" aria-label="다크모드 전환" data-component="Button" title="다크모드 전환">
          <svg class="ico" id="ico-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="ico" id="ico-sun" viewBox="0 0 24 24" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>

      <p class="intro">읽고 싶은 웹 페이지 주소를 붙여넣으면 본문만 Markdown으로 뽑아 줍니다. 복사하거나 파일로 받고, ChatGPT·Claude에 바로 보낼 수 있습니다.</p>

      <form id="url-form" class="url-row" novalidate>
        <div class="url-field" data-component="Input">
          <input class="input" id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://example.com/article" aria-label="웹 페이지 URL">
          <button type="button" class="btn ghost icon clear" id="clear" aria-label="지우기" data-component="Button" hidden>
            <svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <button class="btn go" id="go" type="submit" data-component="Button">
          <svg class="ico spin" id="go-spin" viewBox="0 0 24 24" hidden><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
          <span id="go-label">변환</span>
        </button>
      </form>

      <div class="alert destructive" role="alert" data-component="Alert" data-when="오류" hidden>
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <div><b id="err-title">페이지를 가져오지 못했습니다</b><span class="alert-desc" id="err-desc">서버가 404를 돌려줬습니다. 주소를 확인하고 다시 시도해 주세요.</span></div>
      </div>

      <div class="card" data-component="Card" data-when="변환 중" hidden aria-busy="true" aria-label="변환 중">
        <div class="skel" data-component="Skeleton"><i class="t"></i><i class="w55"></i><i></i><i class="w80"></i><i></i><i class="w55"></i></div>
      </div>

      <article class="card" data-component="Card" data-when="결과,저자 없는 결과" hidden>
        <header class="card-head">
          <h1 id="r-title">제목</h1>
          <div class="meta">
            <span class="author" id="r-author" data-when="결과"></span>
            <span class="badge" data-component="Badge" id="r-site"></span>
            <a id="r-link" href="#" target="_blank" rel="noopener"></a>
          </div>
        </header>
        <div class="export">
          <fieldset style="border:0;padding:0;margin:0;min-width:0">
            <legend class="export-label">LLM에 보낼 프롬프트 <span>· ChatGPT·Claude로 열 때만 앞에 붙습니다</span></legend>
            <div class="chips" role="radiogroup" data-component="ToggleGroup">
              <label class="chip"><input type="radio" name="prompt" value="none" checked><span>프롬프트 없음</span></label>
              <label class="chip"><input type="radio" name="prompt" value="summary"><span>요약해줘</span></label>
              <label class="chip"><input type="radio" name="prompt" value="translate"><span>한국어로 번역해줘</span></label>
              <label class="chip"><input type="radio" name="prompt" value="explain"><span>쉽게 설명해줘</span></label>
              <label class="chip"><input type="radio" name="prompt" value="custom"><span>직접 입력</span></label>
            </div>
            <div class="custom-prompt" id="custom-wrap" hidden data-component="Input">
              <input class="input" id="custom" type="text" autocomplete="off" placeholder="예: 핵심만 3줄로 정리해줘" aria-label="직접 입력 프롬프트">
            </div>
          </fieldset>

          <div>
            <span class="export-label">내보내기</span>
            <div class="actions">
              <button class="btn outline" id="copy" type="button" data-component="Button">
                <svg class="ico" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span id="copy-label">복사하기</span>
              </button>
              <button class="btn outline" id="download" type="button" data-component="Button">
                <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>.md 다운로드
              </button>
              <span class="sep"></span>
              <button class="btn" id="open-chatgpt" type="button" data-component="Button">ChatGPT로 열기
                <svg class="ico" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
              </button>
              <button class="btn" id="open-claude" type="button" data-component="Button">Claude로 열기
                <svg class="ico" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
              </button>
            </div>
          </div>

          <div class="alert" role="status" id="notice" data-component="Alert" hidden>
            <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
            <div id="notice-text"></div>
          </div>
        </div>
        <div class="md-flow"><div class="md" id="r-md"></div></div>

      </article>
    </div>
  </section>
</main>

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const urlEl = $('url'), clearBtn = $('clear'), goBtn = $('go'), goLabel = $('go-label'), goSpin = $('go-spin');
  const noticeEl = $('notice'), noticeText = $('notice-text');
  const customWrap = $('custom-wrap'), customEl = $('custom');

  const PAGES = {
    wiki: {
      url: 'https://ko.wikipedia.org/wiki/마크다운',
      title: '마크다운 - 위키백과, 우리 모두의 백과사전', author: '위키백과 기여자', site: '위키백과',
      md: [
        '**마크다운**(Markdown)은 일반 텍스트 기반의 경량 마크업 언어이다. 쉽게 쓰고 읽을 수 있으며 HTML 등 다른 포맷으로 변환할 수 있다.',
        '## 역사', '2004년 존 그루버가 [애런 스워츠](https://ko.wikipedia.org/wiki/애런_스워츠)와 함께 마크다운을 만들었다. 목표는 "읽기 쉽고 쓰기 쉬운 플레인 텍스트 포맷"이었으며, 이메일에서 쓰던 관습을 문법으로 정리한 것이다.',
        '## 기본 문법', '- 제목은 `#` 기호의 개수로 단계를 나타낸다.', '- 강조는 `*기울임*`과 `**굵게**`로 쓴다.', '- 목록은 `-` 또는 `1.`으로 시작한다.', '- 링크는 `[텍스트](주소)` 형식이다.',
        '> 마크다운 문서는 서식이 적용되지 않은 상태로도 그대로 읽을 수 있어야 한다.',
        '## 변형', '원 문법은 표, 각주, 작업 목록을 다루지 않았다. 이후 GitHub Flavored Markdown, CommonMark처럼 확장하거나 표준을 정리하려는 시도가 이어졌고, 현재 개발 문서와 노트 앱, LLM 입출력에서 사실상 표준 형식으로 쓰인다.',
        '## 활용', '마크다운은 README 파일, 기술 문서, 블로그, 노트 앱, 채팅 도구에서 널리 쓰인다. 서식을 위해 마우스를 잡을 필요 없이 키보드만으로 문서를 쓸 수 있고, 버전 관리 시스템에서 변경 내용을 줄 단위로 비교하기도 쉽다. 최근에는 대규모 언어 모델이 입력과 출력을 모두 마크다운으로 다루면서 웹 페이지를 마크다운으로 바꿔 모델에 넘기는 일이 흔해졌다.',
        '## 렌더러', '마크다운 문서를 HTML로 바꾸는 프로그램을 렌더러라고 한다. 원조인 Markdown.pl 이후 언어마다 다양한 구현이 나왔으며, 구현마다 중첩 목록이나 줄바꿈 같은 모호한 규칙을 처리하는 방식이 조금씩 달라 같은 문서가 다르게 보일 수 있다. CommonMark는 이 차이를 줄이려고 만든 명세이다.',
        '## 한계', '마크다운은 의도적으로 단순하게 설계되어 복잡한 레이아웃, 색상, 글꼴 지정을 표현할 수 없다. 필요하면 문서 안에 HTML을 직접 섞어 쓸 수 있지만, 이 경우 렌더링 환경에 따라 결과가 달라진다. 표준 문법에 없는 기능은 도구마다 확장 문법이 달라서 다른 도구로 옮길 때 깨질 수 있다.',
        '## 각주', '- 존 그루버, "Markdown: Syntax", Daring Fireball, 2004년.', '- 애런 스워츠, "Markdown", 2004년.',
        '## 같이 보기', '- [CommonMark](https://commonmark.org)', '- [reStructuredText](https://ko.wikipedia.org/wiki/ReStructuredText)'
      ].join('\n\n')
    },
    next: {
      url: 'https://nextjs.org/blog/next-16-4',
      title: 'Next.js 16.4 릴리스 노트: 캐싱 모델 재설계와 Turbopack 기본값 전환, 그리고 앞으로의 로드맵', author: '', site: 'Next.js Blog',
      md: [
        'Next.js 16.4를 공개합니다. 이번 릴리스의 핵심은 두 가지입니다. 캐싱 규칙이 한눈에 보이도록 정리했고, 개발과 빌드 모두 Turbopack을 기본값으로 바꿨습니다.',
        '## 주요 변경', '- `use cache` 지시어의 기본 동작 변경', '- Turbopack이 `next build`의 기본 번들러로 전환', '- 서버 컴포넌트 오류 오버레이 개선',
        '## 업그레이드 방법', '다음 명령으로 최신 버전을 설치할 수 있습니다. 변경 사항이 많으니 [업그레이드 가이드](https://nextjs.org/docs/upgrade)를 먼저 읽어 보세요.',
        '`bun add next@16.4.5 react@19.3.1 react-dom@19.3.1`'
      ].join('\n\n')
    },
    short: {
      url: 'https://example.com',
      title: 'Example Domain', author: '', site: 'example.com',
      md: 'This domain is for use in illustrative examples in documents. You may use this domain in literature without prior coordination or asking for permission.\n\n[More information...](https://www.iana.org/domains/example)'
    }
  };
  const ERRORS = {
    invalid: ['올바른 URL이 아닙니다', 'http:// 또는 https://로 시작하는 주소를 입력해 주세요.'],
    fetch: ['페이지를 가져오지 못했습니다', '서버가 404를 돌려줬습니다. 주소를 확인하고 다시 시도해 주세요.'],
    empty: ['본문을 찾지 못했습니다', 'HTML이 아니거나 본문이 비어 있는 페이지입니다. 스크립트로 그려지는 페이지는 변환되지 않을 수 있습니다.']
  };
  const PROMPTS = { none: '', summary: '요약해줘', translate: '한국어로 번역해줘', explain: '쉽게 설명해줘' };
  const URL_LIMIT = 6000;

  let page = null, timer = null;

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => {
    const codes = [];
    const t = esc(s).replace(/`([^`]+)`/g, (_, c) => '\u0000' + (codes.push(c) - 1) + '\u0000')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
  };
  function renderMd(md) {
    return md.split(/\n{2,}/).map(b => {
      if (b.startsWith('## ')) return '<h2>' + inline(b.slice(3)) + '</h2>';
      if (b.startsWith('### ')) return '<h3>' + inline(b.slice(4)) + '</h3>';
      if (b.startsWith('> ')) return '<blockquote>' + inline(b.slice(2)) + '</blockquote>';
      if (b.startsWith('- ')) return '<ul>' + b.split('\n').map(l => '<li>' + inline(l.slice(2)) + '</li>').join('') + '</ul>';
      return '<p>' + inline(b) + '</p>';
    }).join('');
  }

  const promptValue = () => document.querySelector('input[name=prompt]:checked').value;
  const promptText = () => {
    const v = promptValue();
    return v === 'custom' ? customEl.value.trim() : PROMPTS[v];
  };
  const showNotice = html => { noticeText.innerHTML = html; noticeEl.hidden = false; };
  const hideNotice = () => { noticeEl.hidden = true; };

  function setBusy(b) {
    goBtn.disabled = b; goSpin.toggleAttribute('hidden', !b); goLabel.textContent = b ? '변환 중…' : '변환';
  }
  function syncClear() { clearBtn.hidden = !(urlEl.value || page); }

  function showResult(p) {
    page = p;
    $('r-title').textContent = p.title;
    $('r-author').textContent = p.author;
    $('r-site').textContent = p.site;
    const l = $('r-link'); l.textContent = p.url.replace(/^https?:\/\//, ''); l.href = p.url;
    $('r-md').innerHTML = renderMd(p.md);
    
    hideNotice();
    urlEl.removeAttribute('aria-invalid');
    prototypeShell.setState(p.author ? '결과' : '저자 없는 결과');
    syncClear();
  }
  function showError(kind) {
    page = null;
    $('err-title').textContent = ERRORS[kind][0];
    $('err-desc').textContent = ERRORS[kind][1];
    kind === 'invalid' ? urlEl.setAttribute('aria-invalid', 'true') : urlEl.removeAttribute('aria-invalid');
    prototypeShell.setState('오류');
    syncClear();
  }
  function pick(u) {
    if (!/^https?:\/\/[^\s/]+\.[^\s/]+/i.test(u)) return { err: 'invalid' };
    if (/fail|404/i.test(u)) return { err: 'fetch' };
    if (/empty|app\./i.test(u)) return { err: 'empty' };
    if (/wikipedia/i.test(u)) return { page: PAGES.wiki };
    if (/nextjs|ycombinator/i.test(u)) return { page: PAGES.next };
    return { page: PAGES.short };
  }
  function convert() {
    const u = urlEl.value.trim();
    clearTimeout(timer);
    const r = pick(u);
    if (r.err === 'invalid') { showError('invalid'); setBusy(false); return; }
    page = null; hideNotice(); urlEl.removeAttribute('aria-invalid');
    prototypeShell.setState('변환 중'); setBusy(true); syncClear();
    timer = setTimeout(() => { setBusy(false); r.err ? showError(r.err) : showResult(r.page); }, 1000);
  }
  function reset() {
    clearTimeout(timer);
    urlEl.value = ''; page = null; customEl.value = '';
    document.querySelector('input[name=prompt][value=none]').checked = true;
    customWrap.hidden = true; hideNotice(); setBusy(false);
    urlEl.removeAttribute('aria-invalid');
    prototypeShell.setState('Default'); syncClear();
  }

  $('url-form').addEventListener('submit', e => { e.preventDefault(); convert(); });
  urlEl.addEventListener('input', syncClear);
  clearBtn.addEventListener('click', () => { reset(); urlEl.focus(); });

  document.querySelectorAll('input[name=prompt]').forEach(r => r.addEventListener('change', () => {
    customWrap.hidden = promptValue() !== 'custom';
    if (!customWrap.hidden) customEl.focus();
    hideNotice();
  }));

  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); } catch (e) { /* 프로토타입: 클립보드 권한이 없어도 흐름은 보여 준다 */ }
  }
  $('copy').addEventListener('click', async () => {
    if (!page) return;
    await copyText(page.md);
    const l = $('copy-label'); l.textContent = '복사했습니다';
    setTimeout(() => l.textContent = '복사하기', 1600);
  });
  $('download').addEventListener('click', () => {
    if (!page) return;
    const name = (page.title.replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'page') + '.md';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([page.md], { type: 'text/markdown;charset=utf-8' }));
    a.download = name; a.click(); URL.revokeObjectURL(a.href);
  });
  async function openIn(name) {
    if (!page) return;
    const p = promptText();
    const text = p ? p + '\n\n' + page.md : page.md;
    await copyText(text);
    const fits = encodeURIComponent(text).length <= URL_LIMIT;
    showNotice(fits
      ? '클립보드에 복사했고, ' + name + ' 입력창을 채워 새 탭으로 열었습니다.'
      : '클립보드에 복사했습니다. ' + name + '가 열리면 <b style="display:inline">붙여넣기 하세요.</b>');
  }
  $('open-chatgpt').addEventListener('click', () => openIn('ChatGPT'));
  $('open-claude').addEventListener('click', () => openIn('Claude'));

  // 다크모드: 제품의 토글이 리뷰 바의 테마 스위치를 대신 누른다.
  const dark = () => document.body.classList.contains('sh-theme-dark');
  function syncTheme() {
    $('ico-moon').toggleAttribute('hidden', dark()); $('ico-sun').toggleAttribute('hidden', !dark());
  }
  $('theme-toggle').addEventListener('click', () => {
    document.querySelector('#sh-theme button[data-theme=' + (dark() ? 'light' : 'dark') + ']').click(); syncTheme();
  });
  addEventListener('keydown', e => { if (e.key === 't') setTimeout(syncTheme) });
  document.querySelectorAll('#sh-theme button').forEach(b => b.addEventListener('click', syncTheme));

  // 리뷰 바의 상태 선택으로 들어온 경우 같은 상태를 만든다.
  document.getElementById('sh-state').addEventListener('change', e => {
    const s = e.target.value;
    clearTimeout(timer); setBusy(false);
    if (s === 'Default') { reset(); return; }
    if (s === '변환 중') { page = null; urlEl.value = PAGES.wiki.url; setBusy(true); }
    if (s === '결과') { urlEl.value = PAGES.wiki.url; page = PAGES.wiki; fill(PAGES.wiki); }
    if (s === '저자 없는 결과') { urlEl.value = PAGES.next.url; page = PAGES.next; fill(PAGES.next); }
    if (s === '오류') { urlEl.value = 'https://example.com/missing-page-404'; page = null; $('err-title').textContent = ERRORS.fetch[0]; $('err-desc').textContent = ERRORS.fetch[1]; urlEl.removeAttribute('aria-invalid'); }
    syncClear();
  });
  function fill(p) {
    $('r-title').textContent = p.title; $('r-author').textContent = p.author; $('r-site').textContent = p.site;
    const l = $('r-link'); l.textContent = p.url.replace(/^https?:\/\//, ''); l.href = p.url;
    $('r-md').innerHTML = renderMd(p.md); hideNotice();
  }
  syncTheme(); syncClear();
})();
</script>
